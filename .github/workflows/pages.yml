name: Deploy GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Upload can succeed before the artifact is visible to metadata queries.
      - name: Wait for the uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!artifactId) {
              throw new Error('The build job did not return a Pages artifact ID. Re-run all jobs.');
            }
            for (let attempt = 1; attempt <= 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const artifact = artifacts.find(item =>
                String(item.id) === artifactId && item.name === 'github-pages' && !item.expired
              );
              if (artifact) {
                core.info(`Pages artifact ${artifact.id} is available (${artifact.size_in_bytes} bytes).`);
                return;
              }
              core.info(`Pages artifact is not visible yet (attempt ${attempt}/12).`);
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('The uploaded Pages artifact is still unavailable. Re-run all jobs to rebuild and upload it.');
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages
